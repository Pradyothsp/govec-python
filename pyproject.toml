[project]
name = "govec"
version = "0.1.0"
description = "Python client for GoVec, a compact vector search engine, over REST or gRPC"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pradyoth", email = "sppradyoth@outlook.com" }
]
keywords = [
    "vector-database", "vector-search", "similarity-search", "semantic-search",
    "nearest-neighbor-search", "hybrid-search", "embeddings", "rag", "llm",
    "hnsw", "grpc", "govec",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "httpx>=0.28.1",
    "protobuf>=4.25.0",
]

[project.urls]
Homepage = "https://github.com/Pradyothsp/govec-python"
Documentation = "https://github.com/Pradyothsp/govec-python#readme"
Source = "https://github.com/Pradyothsp/govec-python"
Issues = "https://github.com/Pradyothsp/govec-python/issues"
Changelog = "https://github.com/Pradyothsp/govec-python/releases"
"GoVec server" = "https://github.com/Pradyothsp/govec"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60.0",
    "pre-commit>=4.3.0",
    "ruff>=0.12.9",
    "ty>=0.0.84",
    "types-protobuf>=7.35.1.20260906",
]
test = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a running server",
]
# Registering the marker above only silences the unknown-marker warning -- it
# does not deselect anything. Without this, a bare `pytest` tries to reach
# localhost and errors out on every e2e test. The e2e tasks pass their own
# `-m e2e`, which wins because the command line is applied after addopts.
addopts = ["-m", "not e2e"]

[tool.ruff]
extend-exclude = ["src/govec/proto"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/govec/proto"]

[tool.ty.terminal]
error-on-warning = true

[tool.uv]
package = true
