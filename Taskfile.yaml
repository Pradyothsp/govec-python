version: "3"


tasks:
  fmt:
    desc: Format code with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  fmt-check:
    desc: Check formatting and types (ruff + pyright)
    cmds:
      - uv run ruff check .
      - uv run pyright
      - uv run ruff format --check --diff .

  server:health:
    desc: Check GoVec server is running on localhost:8000
    cmd: curl -sf http://localhost:8000/health

  test:e2e:
    desc: Run e2e tests (requires govec server on localhost:8000)
    aliases:
      - test:e
      - test:e2e:local
    preconditions:
      - task server:health
      - msg: "GoVec server is not running on localhost:8000"
    cmd: uv run pytest tests/govec/e2e -v
